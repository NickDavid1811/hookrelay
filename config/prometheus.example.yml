# Run Prometheus on the same host/network as the loopback-only HookRelay API.
scrape_configs:
  - job_name: hookrelay
    scrape_interval: 15s
    scrape_timeout: 5s
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/hookrelay_metrics_token
    static_configs:
      - targets: ['127.0.0.1:8080']
